name: Scrape Amazon Jobs

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config user.name "job-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          git diff --quiet --cached || git commit -m "Update job data $(date -u +%Y-%m-%d)"
          git push
